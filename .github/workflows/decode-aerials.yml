# Decodes base64 aerial uploads from cloud Claude sessions into real JPGs.
# Cloud runs commit text chunks to incoming/<CODE>/part_001..N then an empty
# incoming/<CODE>/DONE marker LAST; this action reassembles, verifies it's a
# real JPEG, writes v/aerials/<CODE>.jpg, cleans up, and commits.

name: Decode aerial uploads
on:
  push:
    paths:
      - "incoming/**"
permissions:
  contents: write
concurrency:
  group: decode-aerials
  cancel-in-progress: false
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble, decode, verify
        run: |
          set -e
          shopt -s nullglob
          changed=0
          for dir in incoming/*/ ; do
            code=$(basename "$dir")
            [ -f "${dir}DONE" ] || { echo "skip $code (no DONE marker yet)"; continue; }
            parts=$(ls "${dir}"part_* 2>/dev/null | sort) || true
            [ -n "$parts" ] || { echo "ERROR: $code has DONE but no parts"; exit 1; }
            cat $parts | tr -d '\n\r ' | base64 -d > "/tmp/${code}.jpg"
            sig=$(head -c 2 "/tmp/${code}.jpg" | xxd -p)
            if [ "$sig" != "ffd8" ]; then
              echo "ERROR: decoded ${code} is not a valid JPEG (magic=$sig) — leaving chunks for inspection"
              exit 1
            fi
            mkdir -p v/aerials
            mv "/tmp/${code}.jpg" "v/aerials/${code}.jpg"
            rm -rf "$dir"
            echo "decoded ${code} -> v/aerials/${code}.jpg"
            changed=1
          done
          echo "changed=$changed" >> "$GITHUB_ENV"
      - name: Commit
        if: env.changed == '1'
        run: |
          git config user.name "aerial-decoder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Decode aerial upload(s) to v/aerials/"
          git push
