name: Build aerials
# IE BOV pipeline — builds parcel-outlined hero aerials ON THE RUNNER so cloud
# sessions never have to transmit image bytes. A cloud session commits a small
# incoming/<CODE>/aerial_job.json (via Zapier); this workflow fetches the county
# parcel rings + public Esri World Imagery tiles, stitches, draws the C&W red
# outline with white halo, and commits the JPG(s) to the repo. Replaces the
# base64 decode path for aerials (decode-aerials.yml stays for anything else).
#
# aerial_job.json format:
# {
#   "code": "47D6SX",
#   "epsg": 2230,                       // 2230 Riverside Co, 2229 SB Co
#   "zoom": 20,                         // max REAL Esri zoom (probe first)
#   "parcel_query_url": "https://...",  // returns ArcGIS feature JSON w/ rings in epsg
#   "quality": 88,
#   "outputs": [
#     {"w_ft":1350,"h_ft":750,"fx":0.5,"fy":0.5,"path":"v/aerials/47D6SX.jpg","w":3375,"h":1875}
#   ]
# }

on:
  push:
    paths:
      - 'incoming/**/aerial_job.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet pillow pyproj

      - name: Build aerials
        run: |
          python3 << 'PYEOF'
          import io, json, os, glob, urllib.request, sys
          from concurrent.futures import ThreadPoolExecutor
          from PIL import Image, ImageDraw
          from pyproj import Transformer

          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"}
          ORIGIN = 20037508.342787

          def fetch(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read()

          jobs = glob.glob('incoming/*/aerial_job.json')
          if not jobs:
              print('no aerial jobs found'); sys.exit(0)

          for jobfile in jobs:
              job = json.load(open(jobfile))
              code = job['code']
              print(f'=== building {code} from {jobfile} ===')
              feat = json.loads(fetch(job['parcel_query_url']))
              rings = feat['features'][0]['geometry']['rings']
              xs = [p[0] for r in rings for p in r]; ys = [p[1] for r in rings for p in r]
              pcx, pcy = (min(xs)+max(xs))/2, (min(ys)+max(ys))/2
              tr = Transformer.from_crs(job['epsg'], 3857, always_xy=True)
              Z = job['zoom']; RES = 2*ORIGIN/(256*2**Z)

              def get(rc):
                  r, c = rc
                  url = f"https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{Z}/{r}/{c}"
                  for attempt in range(3):
                      try: return rc, fetch(url)
                      except Exception:
                          if attempt == 2: raise

              for out in job['outputs']:
                  W_ft, H_ft, fx, fy = out['w_ft'], out['h_ft'], out['fx'], out['fy']
                  x0 = pcx - fx*W_ft; x1 = x0 + W_ft
                  y1 = pcy + fy*H_ft; y0 = y1 - H_ft
                  mx0, my0 = tr.transform(x0, y0); mx1, my1 = tr.transform(x1, y1)
                  c0 = int((mx0+ORIGIN)//(RES*256)); c1 = int((mx1+ORIGIN)//(RES*256))
                  r0 = int((ORIGIN-my1)//(RES*256)); r1 = int((ORIGIN-my0)//(RES*256))
                  tiles = [(r, c) for r in range(r0, r1+1) for c in range(c0, c1+1)]
                  print(f"{out['path']}: {len(tiles)} tiles @ z{Z}")
                  im = Image.new("RGB", (256*(c1-c0+1), 256*(r1-r0+1)))
                  with ThreadPoolExecutor(max_workers=16) as ex:
                      for (r, c), data in ex.map(get, tiles):
                          im.paste(Image.open(io.BytesIO(data)).convert("RGB"), (256*(c-c0), 256*(r-r0)))
                  ox = c0*RES*256 - ORIGIN; oy = ORIGIN - r0*256*RES
                  px0 = (mx0-ox)/RES; px1 = (mx1-ox)/RES
                  py0 = (oy-my1)/RES; py1 = (oy-my0)/RES
                  crop = im.crop((int(px0), int(py0), int(px1), int(py1)))
                  TW, TH = out.get('w', 3375), out.get('h', 1875)
                  up = crop.resize((TW, TH), Image.LANCZOS)
                  sx = TW/crop.size[0]; sy = TH/crop.size[1]
                  draw = ImageDraw.Draw(up)
                  for fill, width in [((255,255,255), 22), ((237,28,43), 12)]:
                      for ring in rings:
                          pts = []
                          for vx, vy in ring:
                              gx, gy = tr.transform(vx, vy)
                              pts.append((((gx-mx0)/RES)*sx, ((my1-gy)/RES)*sy))
                          draw.line(pts, fill=fill, width=width, joint="curve")
                  os.makedirs(os.path.dirname(out['path']), exist_ok=True)
                  up.save(out['path'], quality=job.get('quality', 88))
                  print('wrote', out['path'], os.path.getsize(out['path']), 'bytes')
              os.remove(jobfile)
          PYEOF

      - name: Commit results
        run: |
          git config user.name "aerial-bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Build aerials from job tickets [skip ci]"
          git push
